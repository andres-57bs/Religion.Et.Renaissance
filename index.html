<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Calendario Religión Et Renaissance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel lateral con el escudo del clan sobre fondo brasa, y un panel principal claro con vistas Semana, Mes y Año (2026-2036).
   Color: marfil cálido muy claro, tinta marrón oscura, carmesí del marco del escudo como acento, brasa naranja y oro como detalles.
   Tipografía: Cinzel (capitales renacentistas) para marca y títulos, Figtree para la interfaz. */
:root{
  --bg:#F7F4F0; --surface:#FFFFFF; --surface-2:#FAF7F3; --hover:#F2EDE7; --line:#E7DFD6; --line-2:#F0EAE3;
  --fg:#27191A; --fg-2:#645654; --fg-3:#938785;
  --accent:#A8281F; --accent-fg:#FFFFFF; --accent-soft:#FBEDE8; --gold:#A8712B;
  --now:#D6401F; --ok:#2F9E44; --warn:#9A6414; --warn-bg:#FFF3DC;
  --tint:16%;
  --shadow:0 1px 2px rgba(40,20,15,.07),0 12px 32px rgba(40,20,15,.14);
  --c-torneo:#E8590C; --c-noche:#D99A00; --c-reclutamiento:#2F9E44; --c-especial:#AE3EC9; --c-admin:#3B82F6;
  --c-entrenamiento:#0CA8A0; --c-aniversario:#E64980; --c-descanso:#868E96; --c-otro:#7A6FD0;
  --flame:linear-gradient(90deg,#8E1B14,#D9531A 55%,#E3A94B);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Cinzel','Trajan Pro','Times New Roman',serif;
  --hour:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120D0C; --surface:#1B1413; --surface-2:#221918; --hover:#2B201E; --line:#37292A; --line-2:#2C2120;
  --fg:#F5ECE1; --fg-2:#BBAEA6; --fg-3:#8A7D77;
  --accent:#F0705B; --accent-fg:#1D0A07; --accent-soft:#3B1F1B; --gold:#E3A94B;
  --now:#FF7A5C; --ok:#5CC472; --warn:#E3B04B; --warn-bg:#3A2F17; --tint:26%;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.55);
  --c-torneo:#FF8A4C; --c-noche:#F2B63A; --c-reclutamiento:#5CC472; --c-especial:#CF7BE6; --c-admin:#6AA2FF;
  --c-entrenamiento:#3CCFC6; --c-aniversario:#FF7BA6; --c-descanso:#A0A7AF; --c-otro:#A59CF0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120D0C; --surface:#1B1413; --surface-2:#221918; --hover:#2B201E; --line:#37292A; --line-2:#2C2120;
  --fg:#F5ECE1; --fg-2:#BBAEA6; --fg-3:#8A7D77;
  --accent:#F0705B; --accent-fg:#1D0A07; --accent-soft:#3B1F1B; --gold:#E3A94B;
  --now:#FF7A5C; --ok:#5CC472; --warn:#E3B04B; --warn-bg:#3A2F17; --tint:26%;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.55);
  --c-torneo:#FF8A4C; --c-noche:#F2B63A; --c-reclutamiento:#5CC472; --c-especial:#CF7BE6; --c-admin:#6AA2FF;
  --c-entrenamiento:#3CCFC6; --c-aniversario:#FF7BA6; --c-descanso:#A0A7AF; --c-otro:#A59CF0;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr);gap:16px}

/* ---------- barra lateral ---------- */
.side{display:flex;flex-direction:column;gap:20px;min-height:0;overflow-y:auto;padding:4px 2px 4px 0}
.side>*{flex:none}
.brand{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px 14px 19px 12px;min-height:92px;border-radius:14px;
  background:radial-gradient(120% 150% at 0% 110%,rgba(224,102,28,.42),transparent 58%),linear-gradient(160deg,#150B09,#2A100B 70%,#3A150C);
  border:1px solid #7A5527;box-shadow:inset 0 0 0 1px rgba(227,169,75,.16)}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--flame)}
.brand img{width:58px;height:58px;border-radius:13px;flex:none;box-shadow:0 0 0 1px rgba(227,169,75,.55),0 6px 18px rgba(224,102,28,.4)}
.brand>div{min-width:0;flex:1}
.brand b{display:block;overflow-wrap:anywhere;font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25;color:#F4E7C9}
.brand small{display:block;margin-top:3px;color:#E3A94B;font-size:11.5px;letter-spacing:.03em}
.side h3{margin:0 0 8px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.side h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mini{padding:12px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini-h b{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.05em}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.icon-btn:disabled{opacity:.35;cursor:default}

.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgh{font-size:11px;font-weight:600;color:var(--fg-3);text-align:center;padding:4px 0}
.md{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;color:var(--fg)}
.md:hover{background:var(--hover)}
.md b{font-weight:500}
.md .dots{display:flex;gap:2px;height:4px;margin-top:1px}
.md .dots i{width:4px;height:4px;border-radius:50%}
.md.out{color:var(--fg-3)}
.md.today b{background:var(--accent);color:var(--accent-fg);border-radius:50%;font-weight:600}
.md.sel:not(.today){background:var(--accent-soft)}
.mg.mini .md{height:34px;font-size:12.5px}
.mg.mini .md b{width:22px;height:22px;display:grid;place-items:center}
.mg.year .md{height:30px;font-size:12px}
.mg.year .md b{width:20px;height:20px;display:grid;place-items:center}
.mg.year .md.out{visibility:hidden}

.types{display:flex;flex-direction:column;gap:2px}
.type{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;text-align:left;width:100%;color:var(--fg)}
.type:hover{background:var(--hover)}
.type .sw{width:14px;height:14px;border-radius:4px;background:var(--c);border:2px solid var(--c);flex:none}
.type[aria-pressed="false"] .sw{background:transparent}
.type[aria-pressed="false"] .nm{color:var(--fg-3)}
.type .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type .ct{font-size:12px;color:var(--fg-3)}

.up{display:flex;flex-direction:column;gap:2px}
.up button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:7px 8px;border-radius:8px;width:100%}
.up button:hover{background:var(--hover)}
.up .when{width:38px;flex:none;text-align:center;line-height:1.1}
.up .when b{display:block;font-family:var(--f-ui);font-size:18px;font-weight:700}
.up .when span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.up .what{min-width:0;flex:1}
.up .what b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .what span{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.up .what i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.muted{color:var(--fg-3);font-size:12.5px;padding:2px 8px}

.sync{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--fg-2);padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:5px;flex:none}
.sync.local i{background:var(--warn)}

/* ---------- panel principal ---------- */
.main::before{content:"";flex:none;height:3px;background:var(--flame)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:relative}
.bar .menu{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.primary{background:linear-gradient(135deg,#9E2218,#C9461A);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 1px 2px rgba(120,30,15,.3)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(135deg,#9E2218,#C9461A)}
.btn.danger{color:#C0283D;border-color:transparent}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,#C0283D 12%,var(--surface))}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.label-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em}
.label-btn:hover{background:var(--hover)}
.grow{flex:1}
.push{display:contents}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface-2)}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pop{position:absolute;z-index:30;top:54px;left:96px;width:288px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pop-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pop-h b{font-family:var(--f-display);font-size:16px;letter-spacing:.06em}
.pop-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pop-g button{height:36px;border-radius:8px;font-weight:500}
.pop-g button:hover{background:var(--hover)}
.pop-g button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.notice{display:flex;gap:10px;align-items:center;padding:9px 16px;font-size:13px;background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line)}
.notice.warn{background:var(--warn-bg)}
.notice span{flex:1}
.view{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- vista semana ---------- */
.wk{--cols:7;min-width:0}
.wk-top{position:sticky;top:0;z-index:5;background:var(--surface)}
.wk-row{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr))}
.wk-head{border-bottom:1px solid var(--line)}
.dh{padding:8px 10px 6px;border-left:1px solid var(--line-2);display:flex;align-items:baseline;gap:8px}
.dh .dn{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.dh .dd{font-family:var(--f-ui);font-size:20px;font-weight:700;line-height:1;min-width:30px;height:30px;display:grid;place-items:center;border-radius:15px;padding:0 4px}
.dh.today .dn{color:var(--accent)}
.dh.today .dd{background:var(--accent);color:var(--accent-fg)}
.wk-all{border-bottom:1px solid var(--line);min-height:30px}
.wk-all .g{font-size:10.5px;color:var(--fg-3);padding:8px 6px 0 0;text-align:right}
.wk-all .ad{border-left:1px solid var(--line-2);padding:3px 4px;display:flex;flex-direction:column;gap:3px}
.wk-body{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr));position:relative}
.gut{position:relative;height:calc(var(--hour)*24)}
.gut span{position:absolute;right:8px;font-size:11px;color:var(--fg-3);transform:translateY(-50%);white-space:nowrap}
.col{position:relative;height:calc(var(--hour)*24);border-left:1px solid var(--line-2);cursor:cell;
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line-2) 1px,transparent 1px);
  background-size:100% var(--hour),100% calc(var(--hour)/2)}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}

.ev{--c:var(--c-otro);position:absolute;text-align:left;overflow:hidden;border-radius:6px;border-left:3px solid var(--c);
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface));color:color-mix(in srgb,var(--c) 52%,var(--fg));
  padding:3px 6px;font-size:12px;line-height:1.25;cursor:pointer;z-index:2;box-shadow:0 0 0 1px var(--surface)}
.ev:hover{filter:brightness(.97);z-index:4}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.s-Cancelado b{text-decoration:line-through}
.ev.s-Cancelado,.chip.s-Cancelado{opacity:.55}
.ev.s-Realizado,.chip.s-Realizado{opacity:.75}
.ev.s-Pendiente{border-left-style:dashed}
.chip{--c:var(--c-otro);display:flex;align-items:center;gap:6px;width:100%;height:22px;padding:0 6px;border-radius:5px;text-align:left;font-size:12px;
  border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));color:color-mix(in srgb,var(--c) 52%,var(--fg));cursor:pointer;min-width:0}
.chip:hover{filter:brightness(.97)}
.chip.s-Pendiente{border-left-style:dashed}
.chip em{font-style:normal;opacity:.8;flex:none}
.chip b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.s-Cancelado b{text-decoration:line-through}

/* ---------- vista mes ---------- */
.month{display:flex;flex-direction:column;min-height:100%}
.mh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:4}
.mh span{padding:8px 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr)}
.cell{border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:4px 4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:cell;text-align:left}
.cell:nth-child(7n+1){border-left:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)}
.cell.out .num{color:var(--fg-3)}
.num{align-self:flex-start;height:24px;min-width:24px;padding:0 6px;display:grid;place-items:center;border-radius:12px;font-size:12.5px;font-weight:500}
.num:hover{background:var(--hover)}
.cell.today .num{background:var(--accent);color:var(--accent-fg);font-weight:700}
.more{font-size:12px;color:var(--fg-2);text-align:left;padding:0 6px;height:20px;border-radius:5px}
.more:hover{background:var(--hover);color:var(--fg)}
.cell .dots{display:none;gap:3px;flex-wrap:wrap;padding:0 4px}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- vista año ---------- */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px;padding:16px}
.ymon{padding:10px 10px 8px}
.ymon-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;padding:0 4px}
.ymon-h button{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 4px;margin-left:-4px}
.ymon-h button:hover{color:var(--accent)}
.ymon-h small{color:var(--fg-3);font-size:12px}

/* ---------- ventana de actividad ---------- */
.wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,15,25,.42);
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal::before{content:"";display:block;flex:none;height:3px;background:var(--flame)}
.modal{width:min(540px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.modal form{display:flex;flex-direction:column;min-height:0}
.m-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.m-head h2{margin:0;flex:1;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.m-body{padding:12px 16px 4px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.m-title{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0 8px;font-family:var(--f-ui);font-size:22px;font-weight:700;letter-spacing:-.01em;outline:0}
.m-title:focus{border-color:var(--accent)}
.m-title::placeholder{color:var(--fg-3)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;font-weight:600;color:var(--fg-2)}
.in{height:36px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in:disabled{background:var(--surface-2);color:var(--fg-3)}
.typebox{display:flex;align-items:center;gap:8px}
.typebox i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.m-note{font-size:12.5px;color:var(--fg-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.m-foot{display:flex;align-items:center;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap}
.m-foot .by{flex:1;min-width:120px;font-size:12px;color:var(--fg-3)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;font-size:13px}
.confirm span{flex:1;min-width:140px}

.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(320px,88vw);background:var(--bg);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));

  .scrim.on{display:block;position:fixed;inset:0;z-index:55;background:rgba(15,15,25,.42)}

}

  .mh span{padding:8px 4px;text-align:center}
  .wrap{align-items:flex-end;padding-bottom:0}
  .modal{border-radius:16px 16px 0 0}

}

          <label class="chk" style="margin-top:6px"><input type="checkbox" id="fSerie"> Aplicar estos cambios a toda la serie (la fecha de cada una no cambia)</label>
        </div>
        <div class="m-note" id="roNote" hidden>Tienes acceso de solo lectura. Pide permiso de edición para modificar actividades.</div>
      </div>
      <div class="m-foot" id="mFoot">
        <button class="btn danger" type="button" id="delBtn" hidden>Eliminar</button>
        <span class="by" id="byTxt"></span>
        <button class="btn ghost" type="button" id="cancelBtn">Cancelar</button>
        <button class="btn primary" type="submit" id="saveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var MIN_Y=2026, MAX_Y=2036, HOUR=56;
var TYPES=[
  {k:'torneo',n:'Torneo'},{k:'noche',n:'Noche de juegos'},{k:'reclutamiento',n:'Reclutamiento'},
  {k:'especial',n:'Evento especial'},{k:'admin',n:'Reunión de administración'},{k:'entrenamiento',n:'Entrenamiento'},
  {k:'aniversario',n:'Aniversario o fecha clave'},{k:'descanso',n:'Festivo o descanso'},{k:'otro',n:'Otro (personalizado)'}
];
var TYPE={}; TYPES.forEach(function(t){TYPE[t.k]=t;});
var STATUS=['Pendiente','Confirmado','Realizado','Cancelado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS3=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
var DIAS_INI=['L','M','X','J','V','S','D'];
var LS_UI='rer-cal-ui', LS_EV='rer-cal-events';

var $=function(id){return document.getElementById(id);};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;};
var monday=function(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1];}
function fmtT(t){if(!t)return '';var p=t.split(':').map(Number);return (p[0]%12||12)+':'+pad(p[1])+' '+(p[0]<12?'a. m.':'p. m.');}
function hourLabel(h){return (h%12||12)+' '+(h<12?'a. m.':'p. m.');}
function clampDate(d){var lo=new Date(MIN_Y,0,1,12),hi=new Date(MAX_Y,11,31,12);return d<lo?lo:(d>hi?hi:d);}
var ICON_CHECK='';

var S={view:'semana',anchor:clampDate(new Date()),filters:new Set(TYPES.map(function(t){return t.k;})),
  events:new Map(),byDate:new Map(),loaded:false,mode:'pending',canWrite:true,me:null,user:null,db:null,narrow:false,lastKey:'',popYear:null};
var TODAY=ymd(new Date());

try{var ui=JSON.parse(localStorage.getItem(LS_UI)||'{}');
  if(ui.view&&['semana','mes','anio'].indexOf(ui.view)>=0)S.view=ui.view;
  if(Array.isArray(ui.filters)){S.filters=new Set(ui.filters.filter(function(k){return TYPE[k];}));}
}catch(e){}
function saveUi(){try{localStorage.setItem(LS_UI,JSON.stringify({view:S.view,filters:Array.from(S.filters)}));}catch(e){}}

/* ---------- datos ---------- */
var tk=function(ev){return TYPE[ev.type]?ev.type:'otro';};
var cmpEv=function(a,b){return (b.allDay?1:0)-(a.allDay?1:0)||(a.start||'').localeCompare(b.start||'')||(a.title||'').localeCompare(b.title||'');};
function reindex(){
  S.byDate=new Map();
  S.events.forEach(function(ev){if(!ev.date)return;var a=S.byDate.get(ev.date);if(!a){a=[];S.byDate.set(ev.date,a);}a.push(ev);});
  S.byDate.forEach(function(a){a.sort(cmpEv);});
}
function dayEvents(ds){return (S.byDate.get(ds)||[]).filter(function(e){return S.filters.has(tk(e));});}
function clean(ev){var o={};Object.keys(ev).forEach(function(k){if(k!=='id')o[k]=ev[k];});return o;}
function newId(){
  if(S.db){return S.db.collection('events').doc().id;}
  return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
var Store={
  save:function(id,data){
    if(S.db){return S.db.collection('events').doc(id).set(data);}
    S.events.set(id,Object.assign({id:id},data));persistLocal();reindex();renderAll();return Promise.resolve();
  },
  remove:function(id){
    if(S.db){return S.db.collection('events').doc(id).delete();}
    S.events.delete(id);persistLocal();reindex();renderAll();return Promise.resolve();
  }
};
function persistLocal(){try{localStorage.setItem(LS_EV,JSON.stringify(Array.from(S.events.values())));}catch(e){}}
function loadLocal(){
  try{var arr=JSON.parse(localStorage.getItem(LS_EV)||'[]');arr.forEach(function(e){if(e&&e.id)S.events.set(e.id,e);});}catch(e){}
}

/* ---------- navegación ---------- */
function span(){return S.narrow?3:7;}
function weekStart(){return S.narrow?new Date(S.anchor):monday(S.anchor);}
function shifted(dir){
  var a=new Date(S.anchor);
  if(S.view==='semana')a=addDays(a,dir*span());
  else if(S.view==='mes'){a=new Date(a.getFullYear(),a.getMonth()+dir,1,12);}
  else a=new Date(a.getFullYear()+dir,a.getMonth(),Math.min(a.getDate(),28),12);
  return a;
}
function inRange(d){return d.getFullYear()>=MIN_Y&&d.getFullYear()<=MAX_Y;}
function go(dir){var a=shifted(dir);if(inRange(a)){S.anchor=a;renderAll();}}
function rangeLabel(){
  var y=S.anchor.getFullYear(),m=S.anchor.getMonth();
  if(S.view==='anio')return String(y);
  if(S.view==='mes')return cap(MESES[m])+' '+y;
  var s=weekStart(),e=addDays(s,span()-1);
  if(s.getMonth()===e.getMonth())return s.getDate()+'–'+e.getDate()+' de '+MESES[s.getMonth()]+' de '+s.getFullYear();
  return s.getDate()+' '+MES3[s.getMonth()]+' – '+e.getDate()+' '+MES3[e.getMonth()]+' '+e.getFullYear();
}

/* ---------- render general ---------- */
function renderAll(){renderBar();renderSide();renderNotice();renderMain();}
function renderBar(){
  $('labelTxt').textContent=rangeLabel();
  $('prevBtn').disabled=!inRange(shifted(-1));
  $('nextBtn').disabled=!inRange(shifted(1));
  document.querySelectorAll('#seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===S.view));});
  $('newBtn').hidden=!S.canWrite;
}
function renderNotice(){
  var n=$('notice');
  if(S.mode==='local'){
    n.className='notice warn';n.hidden=false;
    n.innerHTML='<span>Modo local: lo que guardes aquí solo se ve en este navegador. Abre el calendario desde tu cuenta de Claude para que se guarde y lo vea todo el equipo.</span>';
  }else if(S.loaded&&S.events.size===0){
    n.className='notice';n.hidden=false;
    n.innerHTML='<span>Aún no hay actividades. Haz clic en un horario del calendario o en «Nueva actividad» para crear la primera.</span>';
  }else n.hidden=true;
}
function renderSide(){
  renderMini();renderTypes();renderUpcoming();
  var sy=$('sync'),st=$('syncTxt');
  if(S.mode==='shared'){sy.className='sync';st.textContent='Guardado en la nube y compartido con el equipo. Horarios en hora de Colombia (UTC-5).';}
  else if(S.mode==='local'){sy.className='sync local';st.textContent='Solo en este navegador. Horarios en hora de Colombia (UTC-5).';}
  else{sy.className='sync';st.textContent='Conectando…';}
}
function monthGrid(y,m,mode){
  var first=new Date(y,m,1,12),start=monday(first),dim=new Date(y,m+1,0).getDate();
  var rows=Math.ceil((((first.getDay()+6)%7)+dim)/7),sel=ymd(S.anchor);
  var h='<div class="mg '+mode+'">';
  DIAS_INI.forEach(function(d){h+='<span class="mgh">'+d+'</span>';});
  for(var i=0;i<rows*7;i++){
    var d=addDays(start,i),ds=ymd(d),inM=d.getMonth()===m;
    var dots=inM?dayEvents(ds).slice(0,3).map(function(e){return '<i style="background:var(--c-'+tk(e)+')"></i>';}).join(''):'';
    h+='<button type="button" class="md'+(inM?'':' out')+(ds===TODAY?' today':'')+(mode==='mini'&&ds===sel?' sel':'')+'" data-day="'+ds+'"'+(inM?'':' tabindex="-1"')+' aria-label="'+d.getDate()+' de '+MESES[d.getMonth()]+'"><b>'+d.getDate()+'</b><span class="dots">'+dots+'</span></button>';
  }
  return h+'</div>';
}
function renderMini(){
  var y=S.anchor.getFullYear(),m=S.anchor.getMonth();
  var prevOk=inRange(new Date(y,m-1,1)),nextOk=inRange(new Date(y,m+1,1));
  $('mini').innerHTML='<div class="mini-h"><b>'+cap(MESES[m])+' '+y+'</b><span><button class="icon-btn" type="button" data-mini="-1" aria-label="Mes anterior"'+(prevOk?'':' disabled')+'><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button class="icon-btn" type="button" data-mini="1" aria-label="Mes siguiente"'+(nextOk?'':' disabled')+'><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></span></div>'+monthGrid(y,m,'mini');
}
function renderTypes(){
  var y=String(S.anchor.getFullYear()),counts={};
  S.events.forEach(function(e){if(e.date&&e.date.slice(0,4)===y){var k=tk(e);counts[k]=(counts[k]||0)+1;}});
  $('types').innerHTML=TYPES.map(function(t){
    return '<button type="button" class="type" data-type="'+t.k+'" aria-pressed="'+S.filters.has(t.k)+'" style="--c:var(--c-'+t.k+')"><span class="sw"></span><span class="nm">'+esc(t.n)+'</span><span class="ct">'+(counts[t.k]||'')+'</span></button>';
  }).join('');
}
function renderUpcoming(){
  var list=[];
  S.events.forEach(function(e){if(e.date>=TODAY&&e.status!=='Cancelado'&&S.filters.has(tk(e)))list.push(e);});
  list.sort(function(a,b){return a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||'');});
  list=list.slice(0,5);
  if(!list.length){$('upcoming').innerHTML='<div class="muted">No hay actividades próximas.</div>';return;}
  $('upcoming').innerHTML=list.map(function(e){
    var d=parse(e.date);
    return '<button type="button" data-ev="'+esc(e.id)+'" style="--c:var(--c-'+tk(e)+')"><span class="when"><b>'+d.getDate()+'</b><span>'+MES3[d.getMonth()]+'</span></span><span class="what"><b>'+esc(e.title)+'</b><span><i></i>'+(e.typeName&&tk(e)==='otro'?esc(e.typeName)+' · ':'')+(e.allDay?'Todo el día':esc(fmtT(e.start)))+'</span></span></button>';
  }).join('');
}

/* ---------- vistas ---------- */
function renderMain(){
  var v=$('view'),key=S.view+'|'+(S.view==='semana'?ymd(weekStart()):S.view==='mes'?S.anchor.getFullYear()+'-'+S.anchor.getMonth():S.anchor.getFullYear());
  var keep=(key===S.lastKey)?v.scrollTop:null;
  if(S.view==='semana')v.innerHTML=weekHtml();
  else if(S.view==='mes')v.innerHTML=monthHtml();
  else v.innerHTML=yearHtml();
  if(S.view==='semana'){
    if(keep!==null)v.scrollTop=keep;else v.scrollTop=initialScroll();
    updateNow();
  }else if(keep!==null)v.scrollTop=keep;else v.scrollTop=0;
  S.lastKey=key;
}
function layoutDay(list){
  var items=list.map(function(e){
    var s=toMin(e.start||'00:00'),en=e.end?toMin(e.end):s+60;if(en<=s)en=s+30;
    return {e:e,s:s,en:en,col:0,n:1};
  }).sort(function(a,b){return a.s-b.s||b.en-a.en;});
  var out=[],cluster=[],cEnd=-1;
  function flush(){
    var cols=[];
    cluster.forEach(function(it){var c=0;while(cols[c]!==undefined&&cols[c]>it.s)c++;cols[c]=it.en;it.col=c;});
    cluster.forEach(function(it){it.n=cols.length;});
    out=out.concat(cluster);cluster=[];
  }
  items.forEach(function(it){
    if(cluster.length&&it.s>=cEnd){flush();cEnd=-1;}
    cluster.push(it);cEnd=Math.max(cEnd,it.en);
  });
  if(cluster.length)flush();
  return out;
}
function weekHtml(){
  var n=span(),start=weekStart(),days=[],i;
  for(i=0;i<n;i++)days.push(addDays(start,i));
  var h='<div class="wk" style="--cols:'+n+';--hour:'+HOUR+'px"><div class="wk-top"><div class="wk-row wk-head"><div></div>';
  days.forEach(function(d){
    var ds=ymd(d);
    h+='<div class="dh'+(ds===TODAY?' today':'')+'"><span class="dn">'+DIAS3[(d.getDay()+6)%7]+'</span><span class="dd">'+d.getDate()+'</span></div>';
  });
  h+='</div><div class="wk-row wk-all"><div class="g">Todo el día</div>';
  days.forEach(function(d){
    var ev=dayEvents(ymd(d)).filter(function(e){return e.allDay||!e.start;});
    h+='<div class="ad" data-date="'+ymd(d)+'">'+ev.map(chipHtml).join('')+'</div>';
  });
  h+='</div></div><div class="wk-body"><div class="gut">';
  for(i=1;i<24;i++)h+='<span style="top:'+(i*HOUR)+'px">'+hourLabel(i)+'</span>';
  h+='</div>';
  days.forEach(function(d){
    var ds=ymd(d),timed=dayEvents(ds).filter(function(e){return !e.allDay&&e.start;});
    h+='<div class="col'+(ds===TODAY?' today':'')+'" data-col="'+ds+'">';
    layoutDay(timed).forEach(function(it){
      var e=it.e,top=it.s/60*HOUR,ht=Math.max((it.en-it.s)/60*HOUR-2,22);
      h+='<button type="button" class="ev s-'+esc(e.status||'Pendiente')+'" data-ev="'+esc(e.id)+'" style="--c:var(--c-'+tk(e)+');top:'+top+'px;height:'+ht+'px;left:calc('+(it.col/it.n*100)+'% + 1px);width:calc('+(100/it.n)+'% - 3px)" title="'+esc(e.title+' · '+typeLabel(e)+' · '+fmtT(e.start)+(e.end?' – '+fmtT(e.end):''))+'"><b>'+esc(e.title)+'</b>'+(ht>34?'<span>'+esc(fmtT(e.start))+(e.end?' – '+esc(fmtT(e.end)):'')+'</span>':'')+(ht>52&&e.typeName&&tk(e)==='otro'?'<span>'+esc(e.typeName)+'</span>':'')+'</button>';
    });
    if(ds===TODAY)h+='<div class="now" id="nowLine"></div>';
    h+='</div>';
  });
  return h+'</div></div>';
}
function chipHtml(e){
  return '<button type="button" class="chip s-'+esc(e.status||'Pendiente')+'" data-ev="'+esc(e.id)+'" style="--c:var(--c-'+tk(e)+')" title="'+esc(e.title+' · '+typeLabel(e))+'">'+(e.allDay||!e.start?'':'<em>'+esc(fmtT(e.start).replace(':00',''))+'</em>')+'<b>'+esc(e.title)+'</b></button>';
}
function initialScroll(){
  var n=span(),start=weekStart(),min=null,i;
  for(i=0;i<n;i++){dayEvents(ymd(addDays(start,i))).forEach(function(e){if(!e.allDay&&e.start){var m=toMin(e.start);if(min===null||m<min)min=m;}});}
  var hr;
  if(min!==null)hr=Math.max(0,Math.floor(min/60)-1);
  else hr=8;
  return hr*HOUR;
}
function updateNow(){
  var el=$('nowLine');if(!el)return;
  var d=new Date();el.style.top=((d.getHours()*60+d.getMinutes())/60*HOUR)+'px';
}
function monthHtml(){
  var y=S.anchor.getFullYear(),m=S.anchor.getMonth(),first=new Date(y,m,1,12),start=monday(first);
  var dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((((first.getDay()+6)%7)+dim)/7);
  var h='<div class="month"><div class="mh">'+DIAS3.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div><div class="mgrid" style="grid-template-rows:repeat('+rows+',minmax(104px,1fr))">';
  for(var i=0;i<rows*7;i++){
    var d=addDays(start,i),ds=ymd(d),inM=d.getMonth()===m,ev=dayEvents(ds),max=3;
    h+='<div class="cell'+(inM?'':' out')+(ds===TODAY?' today':'')+'" data-cell="'+ds+'" tabindex="0" role="button" aria-label="Crear actividad el '+d.getDate()+' de '+MESES[d.getMonth()]+'"><span class="num" data-day="'+ds+'">'+(d.getDate()===1?d.getDate()+' '+MES3[d.getMonth()]:d.getDate())+'</span>';
    ev.slice(0,max).forEach(function(e){h+=chipHtml(e);});
    if(ev.length>max)h+='<button type="button" class="more" data-day="'+ds+'">+'+(ev.length-max)+' más</button>';
    if(ev.length)h+='<div class="dots">'+ev.slice(0,6).map(function(e){return '<i style="--c:var(--c-'+tk(e)+')"></i>';}).join('')+'</div>';
    h+='</div>';
  }
  return h+'</div></div>';
}
function yearHtml(){
  var y=S.anchor.getFullYear(),h='<div class="year">';
  for(var m=0;m<12;m++){
    var count=0,pre=y+'-'+pad(m+1)+'-';
    S.events.forEach(function(e){if(e.date&&e.date.indexOf(pre)===0&&S.filters.has(tk(e)))count++;});
    h+='<div class="card ymon"><div class="ymon-h"><button type="button" data-month="'+m+'">'+cap(MESES[m])+'</button><small>'+(count?count+(count===1?' actividad':' actividades'):'')+'</small></div>'+monthGrid(y,m,'year')+'</div>';
  }
  return h+'</div>';
}

/* ---------- selector de fecha ---------- */
function openPop(){
  S.popYear=S.anchor.getFullYear();renderPop();$('pop').hidden=false;$('labelBtn').setAttribute('aria-expanded','true');
}
function closePop(){$('pop').hidden=true;$('labelBtn').setAttribute('aria-expanded','false');}
function renderPop(){
  var y=S.popYear,cur=S.anchor;
  $('pop').innerHTML='<div class="pop-h"><button class="icon-btn" type="button" data-py="-1" aria-label="Año anterior"'+(y<=MIN_Y?' disabled':'')+'><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>'+y+'</b><button class="icon-btn" type="button" data-py="1" aria-label="Año siguiente"'+(y>=MAX_Y?' disabled':'')+'><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div><div class="pop-g">'+
    MESES.map(function(mm,i){return '<button type="button" data-pm="'+i+'"'+(cur.getFullYear()===y&&cur.getMonth()===i?' aria-current="true"':'')+'>'+cap(mm.slice(0,3))+'</button>';}).join('')+'</div>';
}

/* ---------- ventana de actividad ---------- */
var M={id:null,serie:[],opener:null,confirming:false};
function fillSelects(){
  $('fType').innerHTML=TYPES.map(function(t){return '<option value="'+t.k+'">'+esc(t.n)+'</option>';}).join('');
  $('fStatus').innerHTML=STATUS.map(function(s){return '<option>'+s+'</option>';}).join('');
}
function setTypeDot(){$('fTypeDot').style.setProperty('--c','var(--c-'+$('fType').value+')');}
function syncType(){
  var o=$('fType').value==='otro';$('typeNameBox').hidden=!o;setTypeDot();
  if(o){
    var seen={},opts='';
    S.events.forEach(function(e){if(e.typeName&&!seen[e.typeName]){seen[e.typeName]=1;opts+='<option value="'+esc(e.typeName)+'">';}});
    $('typeNames').innerHTML=opts;
  }
}
function typeLabel(e){return (tk(e)==='otro'&&e.typeName)?e.typeName:TYPE[tk(e)].n;}
function syncAll(){
  var a=$('fAll').checked;$('timeRow').hidden=a;$('fStart').disabled=a;$('fEnd').disabled=a;
}
function openModal(opts){
  var ev=opts.id?S.events.get(opts.id):null;
  if(!ev&&!S.canWrite)return;
  closePop();
  M.id=ev?ev.id:null;M.opener=document.activeElement;M.confirming=false;
  M.serie=ev&&ev.series?Array.from(S.events.values()).filter(function(o){return o.series===ev.series;}):[];
  $('mTitle').textContent=ev?(S.canWrite?'Editar actividad':'Actividad'):'Nueva actividad';
  $('fTitle').value=ev?ev.title:'';
  $('fType').value=ev?tk(ev):(function(){var f=TYPES.filter(function(t){return S.filters.has(t.k);});return (f[0]||TYPES[0]).k;})();
  $('fStatus').value=ev?(ev.status||'Pendiente'):'Pendiente';
  $('fDate').value=ev?ev.date:(opts.date||ymd(S.anchor));
  $('fAll').checked=ev?!!ev.allDay:false;
  var st=ev?(ev.start||'19:00'):(opts.start||'19:00'),en=ev?(ev.end||''):(opts.end||'');
  if(!ev&&!en){var m=toMin(st)+60;en=pad(Math.min(23,Math.floor(m/60)))+':'+pad(m>=1440?59:m%60);}
  $('fStart').value=st;$('fEnd').value=en;
  $('fWho').value=ev?(ev.who||''):'';
  $('fNotes').value=ev?(ev.notes||''):'';
  $('fRep').value='none';$('untilBox').hidden=true;
  var until=addDays(parse($('fDate').value),84);$('fUntil').value=ymd(clampDate(until));
  $('repeatBox').hidden=!!ev;
  $('serieNote').hidden=!(ev&&M.serie.length>1);
  $('serieTxt').textContent=M.serie.length>1?'Esta actividad forma parte de una serie de '+M.serie.length+'.':'';
  $('fSerie').checked=false;
  $('roNote').hidden=S.canWrite;
  ['fTitle','fType','fTypeName','fStatus','fDate','fAll','fStart','fEnd','fWho','fNotes','fRep','fUntil','fSerie'].forEach(function(id){$(id).disabled=!S.canWrite;});
  $('saveBtn').hidden=!S.canWrite;$('delBtn').hidden=!(ev&&S.canWrite);
  $('cancelBtn').textContent=S.canWrite?'Cancelar':'Cerrar';
  $('byTxt').textContent='';
  resetFoot();
  $('fTypeName').value=ev?(ev.typeName||''):'';
  syncAll();syncType();
  $('modal').hidden=false;
  if(ev&&ev.by&&S.user){
    S.user.profiles([ev.by]).then(function(ps){var p=ps[ev.by];if(p&&p.name&&M.id===ev.id)$('byTxt').textContent='Creada por '+p.name;}).catch(function(){});
  }
  setTimeout(function(){(S.canWrite?$('fTitle'):$('cancelBtn')).focus();},30);
}
function closeModal(){$('modal').hidden=true;M.id=null;if(M.opener&&M.opener.focus)try{M.opener.focus();}catch(e){}}
function resetFoot(){
  M.confirming=false;
  $('mFoot').innerHTML='<button class="btn danger" type="button" id="delBtn"'+(M.id&&S.canWrite?'':' hidden')+'>Eliminar</button><span class="by" id="byTxt">'+esc($('byTxt')?$('byTxt').textContent:'')+'</span><button class="btn ghost" type="button" id="cancelBtn">'+(S.canWrite?'Cancelar':'Cerrar')+'</button><button class="btn primary" type="submit" id="saveBtn"'+(S.canWrite?'':' hidden')+'>Guardar</button>';
}
function askDelete(){
  M.confirming=true;
  var serie=M.serie.length>1;
  $('mFoot').innerHTML='<div class="confirm"><span>'+(serie?'¿Eliminar esta actividad o toda la serie?':'¿Eliminar esta actividad? No se puede deshacer.')+'</span>'+
    '<button class="btn danger" type="button" id="delOne">'+(serie?'Solo esta':'Eliminar')+'</button>'+(serie?'<button class="btn danger" type="button" id="delAll">Toda la serie ('+M.serie.length+')</button>':'')+'<button class="btn ghost" type="button" id="delNo">Cancelar</button></div>';
}
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'Se llenó el almacenamiento del calendario. Elimina actividades antiguas.';
  if(c==='invalid_argument'){S.canWrite=false;renderBar();return 'No tienes permiso para editar este calendario.';}
  if(c==='resource_exhausted')return 'Demasiadas operaciones seguidas. Espera un momento e inténtalo otra vez.';
  return 'No se pudo guardar. Inténtalo de nuevo.';
}
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2800);}
function occurrences(date,rep,until){
  var out=[date];if(rep==='none')return out;
  var d0=parse(date),end=parse(until),maxD=new Date(MAX_Y,11,31,12),i=1,d;
  while(out.length<200){
    if(rep==='weekly')d=addDays(d0,7*i);
    else if(rep==='biweekly')d=addDays(d0,14*i);
    else{var y=d0.getFullYear(),m=d0.getMonth()+i,dim=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(d0.getDate(),dim),12);}
    if(d>end||d>maxD)break;
    out.push(ymd(d));i++;
  }
  return out;
}
async function submitForm(){
  if(!S.canWrite)return;
  var title=$('fTitle').value.trim();
  if(!title){$('fTitle').focus();toast('Escribe el nombre de la actividad.');return;}
  var date=$('fDate').value;
  if(!date||parse(date).getFullYear()<MIN_Y||parse(date).getFullYear()>MAX_Y){toast('Elige una fecha entre 2026 y 2036.');return;}
  var all=$('fAll').checked,start=all?'':$('fStart').value,end=all?'':$('fEnd').value;
  if(!all&&!start){toast('Indica la hora de inicio.');return;}
  if(!all&&end&&toMin(end)<=toMin(start)){toast('La hora de fin debe ser posterior al inicio.');return;}
  var typeVal=$('fType').value;
  var fields={title:title,type:typeVal,typeName:typeVal==='otro'?$('fTypeName').value.trim():'',status:$('fStatus').value,allDay:all,start:start,end:end,who:$('fWho').value.trim(),notes:$('fNotes').value.trim()};
  var id=M.id,serie=M.serie.slice(),applySerie=$('fSerie').checked,rep=$('fRep').value,until=$('fUntil').value;
  if(!id&&rep!=='none'&&(!until||until<date)){toast('Elige hasta cuándo se repite.');return;}
  var orig=id?S.events.get(id):null;
  closeModal();toast('Guardando…');
  try{
    if(id){
      await Store.save(id,Object.assign({},clean(orig),fields,{date:date}));
      if(applySerie){
        for(var i=0;i<serie.length;i++){if(serie[i].id!==id)await Store.save(serie[i].id,Object.assign({},clean(serie[i]),fields));}
      }
      toast('Actividad actualizada');
    }else{
      var dates=occurrences(date,rep,until),sid=dates.length>1?newId():null;
      for(var j=0;j<dates.length;j++){
        var d=Object.assign({},fields,{date:dates[j],by:S.me&&S.me.id?S.me.id:null});
        if(sid)d.series=sid;
        await Store.save(newId(),d);
      }
      S.anchor=clampDate(parse(date));
      toast(dates.length>1?dates.length+' actividades creadas':'Actividad creada');
      renderAll();
    }
  }catch(e){toast(errMsg(e));}
}
async function doDelete(all){
  var ids=all?M.serie.map(function(e){return e.id;}):[M.id];
  closeModal();toast('Eliminando…');
  try{for(var i=0;i<ids.length;i++)await Store.remove(ids[i]);toast(ids.length>1?'Serie eliminada':'Actividad eliminada');}
  catch(e){toast(errMsg(e));}
}

/* ---------- eventos de la interfaz ---------- */
function newAt(date,min){
  var s=pad(Math.floor(min/60))+':'+pad(min%60),e=Math.min(1439,min+60);
  openModal({date:date,start:s,end:pad(Math.floor(e/60))+':'+pad(e%60)});
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(!$('pop').hidden&&!t.closest('#pop')&&!t.closest('#labelBtn'))closePop();
  var b;
  if((b=t.closest('[data-ev]'))){openModal({id:b.dataset.ev});closeSide();return;}
  if((b=t.closest('[data-type]'))){
    var k=b.dataset.type;if(S.filters.has(k))S.filters.delete(k);else S.filters.add(k);
    saveUi();renderAll();return;
  }
  if((b=t.closest('[data-mini]'))){var d=new Date(S.anchor.getFullYear(),S.anchor.getMonth()+Number(b.dataset.mini),1,12);if(inRange(d)){S.anchor=d;renderAll();}return;}
  if((b=t.closest('.mini [data-day]'))){S.anchor=parse(b.dataset.day);if(S.view==='anio')S.view='semana';saveUi();renderAll();closeSide();return;}
  if((b=t.closest('.year [data-day]'))){S.anchor=parse(b.dataset.day);S.view='semana';saveUi();renderAll();return;}
  if((b=t.closest('[data-month]'))){S.anchor=new Date(S.anchor.getFullYear(),Number(b.dataset.month),1,12);S.view='mes';saveUi();renderAll();return;}
  if((b=t.closest('.more'))){S.anchor=parse(b.dataset.day);S.view='semana';saveUi();renderAll();return;}
  if((b=t.closest('.num[data-day]'))){S.anchor=parse(b.dataset.day);S.view='semana';saveUi();renderAll();e.stopPropagation();return;}
  if((b=t.closest('[data-cell]'))){if(S.narrow){S.anchor=parse(b.dataset.cell);S.view='semana';saveUi();renderAll();}else if(S.canWrite)newAt(b.dataset.cell,19*60);return;}
  if((b=t.closest('.ad'))){if(S.canWrite)openModal({date:b.dataset.date,start:'19:00'});return;}
  if((b=t.closest('[data-col]'))){
    if(!S.canWrite)return;
    var r=b.getBoundingClientRect(),min=Math.floor((e.clientY-r.top)/HOUR*2)*30;
    newAt(b.dataset.col,Math.max(0,Math.min(min,23*60)));return;
  }
  if((b=t.closest('[data-py]'))){S.popYear=Math.max(MIN_Y,Math.min(MAX_Y,S.popYear+Number(b.dataset.py)));renderPop();return;}
  if((b=t.closest('[data-pm]'))){S.anchor=new Date(S.popYear,Number(b.dataset.pm),Math.min(S.anchor.getDate(),28),12);closePop();renderAll();return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('modal').hidden)closeModal();else if(!$('pop').hidden)closePop();else closeSide();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cell')&&e.target===document.activeElement){
    e.preventDefault();if(S.canWrite)newAt(e.target.dataset.cell,19*60);
  }
});
$('todayBtn').addEventListener('click',function(){S.anchor=clampDate(new Date());renderAll();});
$('prevBtn').addEventListener('click',function(){go(-1);});
$('nextBtn').addEventListener('click',function(){go(1);});
$('labelBtn').addEventListener('click',function(e){e.stopPropagation();if($('pop').hidden)openPop();else closePop();});
$('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;saveUi();renderAll();});
$('newBtn').addEventListener('click',function(){var n=new Date(),d=inRange(S.anchor)?S.anchor:n;openModal({date:ymd(d),start:'19:00'});});
function closeSide(){$('side').classList.remove('open');$('scrim').classList.remove('on');}
$('menuBtn').addEventListener('click',function(){$('side').classList.add('open');$('scrim').classList.add('on');});
$('scrim').addEventListener('click',closeSide);
$('mClose').addEventListener('click',closeModal);
$('modal').addEventListener('mousedown',function(e){if(e.target===$('modal'))closeModal();});
$('fType').addEventListener('change',syncType);
$('fAll').addEventListener('change',syncAll);
$('fRep').addEventListener('change',function(){$('untilBox').hidden=$('fRep').value==='none';});
$('fDate').addEventListener('change',function(){if($('fDate').value)$('fUntil').value=ymd(clampDate(addDays(parse($('fDate').value),84)));});
$('form').addEventListener('submit',function(e){e.preventDefault();submitForm();});
$('mFoot').addEventListener('click',function(e){
  var id=e.target.closest('button')&&e.target.closest('button').id;
  if(id==='cancelBtn')closeModal();
  else if(id==='delBtn')askDelete();
  else if(id==='delNo')resetFoot();
  else if(id==='delOne')doDelete(false);
  else if(id==='delAll')doDelete(true);
});
function checkNarrow(){var n=innerWidth<720;if(n!==S.narrow){S.narrow=n;renderAll();}}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(checkNarrow,120);});
setInterval(function(){updateNow();var t=ymd(new Date());if(t!==TODAY){TODAY=t;renderAll();}},60000);

/* ---------- arranque ---------- */
fillSelects();
S.narrow=innerWidth<720;
renderAll();

(async function init(){
  var db=null,user=null;
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');}}catch(e){db=null;}
  try{if(window.claude&&window.claude.use){user=await window.claude.use('user');}}catch(e){user=null;}
  if(user){
    S.user=user;
    try{S.me=await user.me();}catch(e){}
    try{var can=await user.can('data.write');if(can===false)S.canWrite=false;}catch(e){}
  }
  if(db){
    S.db=db;S.mode='shared';
    try{
      db.collection('events').onSnapshot(function(snap){
        var m=new Map();snap.docs.forEach(function(d){var data=d.data();if(data)m.set(d.id,Object.assign({id:d.id},data));});
        S.events=m;S.loaded=true;reindex();renderAll();
      },function(err){
        S.db=null;S.mode='local';S.loaded=true;loadLocal();reindex();renderAll();
        if(err&&err.code==='revoked')toast('Se perdió el acceso al calendario compartido.');
      });
    }catch(e){S.db=null;S.mode='local';S.loaded=true;loadLocal();reindex();renderAll();}
  }else{
    S.mode='local';S.loaded=true;loadLocal();reindex();renderAll();
  }
})();
})();
</script>
